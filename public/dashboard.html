<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness App Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
    
</head>
<body>
<!-- 
       Dashboard Screen
-->
  <section id="dashboard">
    <h1>EXERCISE DASHBOARD</h1>
    <!-- this needs to display the users name at the top of the page-->
     <h2 id="username">${username}</h2>
    <button id="logoutBtn">Logout</button>
    <article class="container">

      <section>
        <header>
          <h2>Add New Exercise</h2>
        </header>

        <form id="exerciseForm">

            <div class="spacing">
                <label for="description">Description of Exercise</label>
                <input type="text" id="description" required />
            </div>
        
            <div class="spacing">
                <label for="targetRepetitions">Target Repetitions (min 1 and max 20)</label>
                <input type="number" id="targetRepetitions" min="1" max="20"/>
            </div>
        
            <div class="spacing">
                <label for="targetTimeDuration">Time Duration of Exercise (min 1 and max 180)</label>
                <input type="number" id="targetTimeDuration" min="1" max="180"/>
            </div>
        
            <div class="spacing">
                <label for="weightUSE">Weight Used</label>
                <input type="number" id="weightUSE" />
            </div>
        
            <div class="spacing">
                <label for="category">Category of Exercise</label>
                <select id="category">
                    <option value="Warm-up">Warm-Up</option>
                    <option value="Cardio">Cardio</option>
                    <option value="Weightlifting">Weightlifting</option>
                    <option value="Cool-down">Cool-down</option>
                </select>
            </div>


            <!--CODE FOR THE WORKOUT SCHEDULE SCHEMA-->
            <div class="spacing">
                <label for="dayOfWeek">Day of Week</label>
                <select id="dayOfWeek">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                </select>
            </div>

            <div class="spacing">
                <label for="targetBodyParts">Target Body Parts</label>
                <select id="targetBodyParts">
                    <option value="Chest">Chest</option>
                    <option value="Back">Back</option>
                    <option value="Legs">Legs</option>
                    <option value="Shoulders">Shoulders</option>
                    <option value="Arms">Arms</option>
                    <option value="Core">Core</option>
                    <option value="Full Body">Full Body</option>
                    <option value="Cardio">Cardio</option>
                </select>
            </div>

            <div class="spacing">
                <label for="isRestDay">Is it a rest day?</label>
                <input type="checkbox" id="isRestDay"/>
            </div>
        
            <button type="submit">Add New Exercise</button>
        
        </form>
      </section>



    <!--
      MY EXERCISES
    -->
      <section>
        <header>
          <h2>My EXERCISES</h2>
          <div id="exerciseStats"></div>
        </header>

        
        <div id="exerciseError" class="error"></div>
        <div id="exerciseList"></div>
        <p> Filter by: </p>

        <select id="filterCategory">
     <option value="">All</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
            <option value="Cardio">Cardio</option>
            <option value="Weightlifting">Weightlifting</option>
            <option value="Warm-up">Warm-Up</option>
            <option value="Cool-down">Cool-Down</option>
        </select>
        
      </section>

    </article>
  </section>
</body>
