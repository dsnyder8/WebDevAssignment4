<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness App Login</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js" defer></script>
</head>
<body>
    <main class="login-shell">
        <section class="brand">
            <h1>Fitness Tracker</h1>
            <p>Sign in to manage users, exercises, and weekly workout schedules in one place.</p>
            <div class="stats">
                <span>Track custom workouts</span>
                <span>Review your weekly split</span>
                <span>Keep your training history organized</span>
            </div>
        </section>
        <section class="panel">
            <p>Use your account details to continue</p>

            <form id="loginForm" novalidate>
                <label for="email">
                    Email
                    <input id="email" name="email" type="email" required>
                </label>
                <p></p>
                <label for="password">
                    Password
                    <input id="password" name="password" type="password" minlength="6" required>
                </label>
                <p></p>
                
                <div class="form-actions">
                    <button type="submit">Log In</button>
                    <p class="form-footer">
                        New User? <a href="/registerUser.html">Create an account here</a>
                    </p>
                </div>
            </form>

            <p id="message" class="msg" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
